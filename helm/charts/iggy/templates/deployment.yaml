{{ if .Values.server.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iggy.fullname" . }}
  labels:
    {{ include "iggy.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.server.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{ include "iggy.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{ include "iggy.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "iggy.serviceAccountName" . }}
      securityContext:
        {{ toYaml .Values.server.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{ toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.ports.http }}
              protocol: TCP
            - name: tcp
              containerPort: {{ .Values.server.ports.tcp }}
              protocol: TCP
            - name: quic
              containerPort: {{ .Values.server.ports.quic }}
              protocol: TCP
          env:
            {{ if .Values.server.users.root.existingSecret.name }}
            - name: IGGY_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.users.root.existingSecret.name }}
                  key: {{ .Values.server.users.root.existingSecret.usernameKey }}
            - name: IGGY_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.users.root.existingSecret.name }}
                  key: {{ .Values.server.users.root.existingSecret.passwordKey }}
            {{ else }}{{ if .Values.server.users.root.createSecret }}
            - name: IGGY_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "iggy.fullname" . }}-root-credentials
                  key: username
            - name: IGGY_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "iggy.fullname" . }}-root-credentials
                  key: password
            {{- end }}{{- end}}
            {{- if .Values.ui.enabled }}
            - name: IGGY_HTTP_WEB_UI
              value: "true"
            {{- end }}
            - name: IGGY_HTTP_ADDRESS
              value: "0.0.0.0:{{ .Values.server.ports.http }}"
            - name: IGGY_QUIC_ADDRESS
              value: "0.0.0.0:{{ .Values.server.ports.quic }}"
            - name: IGGY_TCP_ADDRESS
              value: "0.0.0.0:{{ .Values.server.ports.tcp }}"
            {{ if .Values.server.env }}
            {{- range .Values.server.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{ end }}
          volumeMounts:
            - name: iggy-server-data
              mountPath: /app/local_data
              subPath: {{ ternary "root" (printf "%s/root" .Values.server.persistence.subPath) (empty .Values.server.persistence.subPath) }}

          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: iggy-server-data
          {{- if .Values.server.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ if .Values.server.persistence.existingClaim }}{{ .Values.server.persistence.existingClaim }}{{- else }}{{ template "iggy.fullname" . }}{{- end }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
